[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "blockpali"
version = "0.1.0"
description = "Dynamic block multi-vector retrieval with Qwen2.5-VL"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.11", "transformers==4.57.6", "peft>=0.18,<0.19",
  "accelerate>=1.10,<2", "numpy>=1.26,<3", "Pillow>=10,<13",
  "PyYAML>=6,<7", "tqdm>=4.66,<5", "safetensors>=0.4.3,<1",
]

[project.optional-dependencies]
layout = ["rapid-layout==1.1.0", "onnxruntime>=1.20,<2", "pyarrow>=17,<24"]
test = ["pytest>=8,<10"]

[project.scripts]
blockpali-prepare = "blockpali.cli.prepare:main"
blockpali-train = "blockpali.cli.train:main"
blockpali-encode = "blockpali.cli.encode:main"
blockpali-evaluate = "blockpali.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
